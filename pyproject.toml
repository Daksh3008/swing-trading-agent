[project]
name = "sta"
version = "0.1.0"
description = "Swing Trading Agent - Indian mid/small/microcap momentum research"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.26",
    "pyarrow>=14.0",
    "requests>=2.31",
    "yfinance>=1.0",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP042: str+Enum mixins are kept for JSON/`str()` compatibility with existing
# serialized trade logs.
ignore = ["UP042"]
